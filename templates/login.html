<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VehicleGate — Portal Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:        #080c14;
  --surface:   #0f1623;
  --card:      #141d2e;
  --border:    rgba(255,255,255,0.08);
  --green:     #00e676;
  --green-dim: rgba(0,230,118,0.12);
  --red:       #ff3d3d;
  --red-dim:   rgba(255,61,61,0.14);
  --blue:      #2979ff;
  --blue-hover:#1c68e3;
  --text:      #e8eaf6;
  --muted:     #6b7a99;
  --radius:    14px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
}

/* Background Ambient Glows */
.ambient-glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  opacity: 0.35;
  z-index: 0;
}
.glow-blue {
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, #2979ff, transparent 70%);
  top: -120px;
  left: -100px;
}
.glow-green {
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, #00e676, transparent 70%);
  bottom: -100px;
  right: -80px;
}

/* Login Wrapper */
.login-container {
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
}

.login-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 38px 32px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.03);
  backdrop-filter: blur(10px);
}

.login-header {
  text-align: center;
  margin-bottom: 28px;
}

.logo-badge {
  width: 54px;
  height: 54px;
  border-radius: 14px;
  background: linear-gradient(135deg, #2979ff, #00e676);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(41, 121, 255, 0.3);
}

.login-header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.login-header p {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 500;
}

/* Error Banner */
.alert-error {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--red-dim);
  border: 1px solid var(--red);
  color: #ff6b6b;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 22px;
  animation: shake 0.35s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

/* Form Styles */
.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.input-icon {
  position: absolute;
  left: 14px;
  font-size: 16px;
  color: var(--muted);
  pointer-events: none;
}

.form-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px 12px 42px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.form-input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(41, 121, 255, 0.2);
}

.form-input::placeholder {
  color: #4b5872;
}

.toggle-password {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  padding: 4px;
  border-radius: 6px;
  transition: color 0.15s;
}
.toggle-password:hover {
  color: var(--text);
}

.form-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  font-size: 13px;
}

.remember-me {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  color: var(--muted);
  user-select: none;
}
.remember-me input {
  accent-color: var(--blue);
  cursor: pointer;
  width: 15px;
  height: 15px;
}

.btn-submit {
  width: 100%;
  background: var(--blue);
  color: #ffffff;
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
  box-shadow: 0 4px 16px rgba(41, 121, 255, 0.35);
}

.btn-submit:hover {
  background: var(--blue-hover);
  transform: translateY(-1px);
}

.btn-submit:active {
  transform: translateY(0);
}

/* Credentials Helper Card */
.credentials-hint {
  margin-top: 24px;
  padding: 14px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px dashed var(--border);
  border-radius: 10px;
  font-size: 12px;
  color: var(--muted);
}

.credentials-hint-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-weight: 600;
  color: #9aa8c2;
}

.demo-btn {
  background: rgba(41, 121, 255, 0.12);
  border: 1px solid rgba(41, 121, 255, 0.3);
  color: #64b5f6;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  transition: all 0.15s;
}
.demo-btn:hover {
  background: rgba(41, 121, 255, 0.25);
  color: #fff;
}

.credential-row {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
}
.credential-row code {
  color: var(--text);
  background: rgba(0,0,0,0.3);
  padding: 2px 6px;
  border-radius: 4px;
}
</style>
</head>
<body>

<div class="ambient-glow glow-blue"></div>
<div class="ambient-glow glow-green"></div>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-badge">🚗</div>
      <h1>VehicleGate</h1>
      <p>Secure Portal Authentication</p>
    </div>

    {% if error %}
    <div class="alert-error">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-input" 
            placeholder="Enter username" 
            required 
            autofocus 
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="Enter password" 
            required 
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password" id="togglePasswordBtn" title="Toggle password visibility">
            👁️
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember_me" checked/>
          <span>Remember session</span>
        </label>
      </div>

      <button type="submit" class="btn-submit">Sign In to Dashboard →</button>
    </form>

    <div class="credentials-hint">
      <div class="credentials-hint-title">
        <span>Default Access</span>
        <button type="button" class="demo-btn" onclick="fillDemoCredentials()">Auto Fill</button>
      </div>
      <div class="credential-row">
        <span>Admin:</span>
        <code>admin / admin123</code>
      </div>
      <div class="credential-row">
        <span>Security Guard:</span>
        <code>guard / guard123</code>
      </div>
    </div>
  </div>
</div>

<script>
// Toggle Password Visibility
const toggleBtn = document.getElementById('togglePasswordBtn');
const passwordInput = document.getElementById('password');

toggleBtn.addEventListener('click', () => {
  const isPassword = passwordInput.getAttribute('type') === 'password';
  passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
  toggleBtn.textContent = isPassword ? '🙈' : '👁️';
});

// Quick demo autofill helper
function fillDemoCredentials() {
  document.getElementById('username').value = 'admin';
  document.getElementById('password').value = 'admin123';
}
</script>

</body>
</html>
